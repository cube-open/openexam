<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>已交卷 · {{ exam['title'] }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="app-body" style="--primary: {{ brand_color }}; --primary-dark: {{ brand_color }}" data-density="{{ ui_density }}">
    <header class="topbar">
        <div class="brand">
            {% if logo_url %}<span class="brand-logo"><img src="{{ logo_url }}" alt="{{ brand_name }}"></span>{% endif %}
            <span class="brand-name">{{ brand_name }}</span>{% if brand_tagline %}<span class="brand-tagline">{{ brand_tagline }}</span>{% endif %}
        </div>
        <div class="topbar-user">
            <span class="user-meta">{{ display_name }} · {{ client_ip }}</span>
            <a class="nav-link" href="{{ url_for('dashboard') }}">返回首页</a>
            <a class="nav-link" href="{{ url_for('logout') }}">退出登录</a>
        </div>
    </header>

    <main class="container narrow">
        <div class="empty-state" style="margin-top:24px">
            <div style="font-size:40px; margin-bottom:12px">
                <svg class="icon" style="width:48px;height:48px;color:var(--primary)" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
            </div>
            <h2>已交卷</h2>
            <p class="muted">《{{ exam['title'] }}》已成功提交，成绩与答案解析暂未开放，请留意老师通知。</p>
            {% if exam['show_original'] %}
            <a class="btn primary" style="margin-top:16px" href="{{ url_for('exam_original', exam_id=exam['id']) }}">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path></svg>查看原卷
            </a>
            {% endif %}
            {% if exam['enable_reflection'] %}
            <a class="btn" style="margin-top:12px" href="{{ url_for('reflection', exam_id=exam['id']) }}">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>写反思
            </a>
            {% endif %}
        </div>
    </main>
    <script src="{{ url_for('static', filename='ui.js') }}" defer></script>
</body>
</html>
