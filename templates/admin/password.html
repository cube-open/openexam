<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>修改密码 · 后台</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="app-body admin-layout" style="--primary: {{ brand_color }}; --primary-dark: {{ brand_color }}" data-density="{{ ui_density }}">
    <aside class="admin-sidebar">
        <div class="brand">
            {% if logo_url %}<span class="brand-logo"><img src="{{ logo_url }}" alt="{{ brand_name }}"></span>{% endif %}
            <span class="brand-name">{{ brand_name }}</span>{% if brand_tagline %}<span class="brand-tagline">{{ brand_tagline }}</span>{% endif %}
        </div>
        {% set active = 'password' %}
        {% include 'admin/_nav.html' %}
    </aside>

    <main class="container narrow">
        <h1 class="page-title">修改管理员密码</h1>
        {% include '_flash.html' %}

        <section class="panel">
            <form method="post" class="stack-form">
                <div class="field">
                    <label>用户名</label>
                    <input type="text" value="{{ username }}" disabled>
                </div>
                <div class="field">
                    <label>当前密码</label>
                    <input type="password" name="old_password" required autocomplete="current-password">
                </div>
                <div class="field">
                    <label>新密码（至少 6 位）</label>
                    <input type="password" name="new_password" required autocomplete="new-password">
                </div>
                <div class="field">
                    <label>确认新密码</label>
                    <input type="password" name="confirm_password" required autocomplete="new-password">
                </div>
                <button type="submit" class="btn primary" style="margin-top:18px">保存修改</button>
            </form>
        </section>
    </main>
    <script src="{{ url_for('static', filename='ui.js') }}" defer></script>
</body>
</html>
