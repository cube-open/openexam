<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>写反思 · {{ exam['title'] }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="app-body" style="--primary: {{ brand_color }}; --primary-dark: {{ brand_color }}" data-density="{{ ui_density }}">
    <header class="topbar">
        <div class="brand">
            {% if logo_url %}<span class="brand-logo"><img src="{{ logo_url }}" alt="{{ brand_name }}"></span>{% endif %}
            <span class="brand-name">{{ brand_name }}</span>{% if brand_tagline %}<span class="brand-tagline">{{ brand_tagline }}</span>{% endif %}
        </div>
        <div class="topbar-user">
            <span class="user-meta">{{ display_name }} · {{ client_ip }}</span>
            <a class="nav-link" href="{{ url_for('result', exam_id=exam['id']) }}">返回成绩</a>
            <a class="nav-link" href="{{ url_for('logout') }}">退出</a>
        </div>
    </header>

    <main class="container" style="max-width:820px">
        {% include '_flash.html' %}

        <div class="reflection-card">
            <div class="reflection-head">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>
                <h2>{{ exam['title'] }} · 考试反思</h2>
            </div>
            <p class="reflection-sub">{{ stu['name'] }}，写多写少都行，想到哪写到哪～不用太正式，老师都会认真看的。</p>

            <form method="post" id="reflection-form" action="{{ url_for('reflection', exam_id=exam['id']) }}">
                <textarea name="reflection" id="reflection-text" class="reflection-input"
                          placeholder="这次考得怎么样？&#10;哪道题最可惜、卡在了哪里？&#10;下次想怎么准备……">{{ result['reflection'] }}</textarea>
                <div class="reflection-meta">
                    <span id="reflection-count" class="muted small">已写 0 字</span>
                    <span id="save-status" class="muted small"></span>
                </div>
                <button type="submit" class="btn primary block" style="margin-top:16px">保存反思</button>
            </form>
        </div>
    </main>

    <script>
        (function () {
            var ta = document.getElementById('reflection-text');
            var countEl = document.getElementById('reflection-count');
            var statusEl = document.getElementById('save-status');
            var form = document.getElementById('reflection-form');
            var SAVE_URL = "{{ url_for('reflection', exam_id=exam['id']) }}";
            var DRAFT_KEY = 'reflection_draft_{{ exam["id"] }}';

            try {
                var draft = localStorage.getItem(DRAFT_KEY);
                if (draft !== null) ta.value = draft;
            } catch (e) {}

            function updateCount() {
                if (countEl) countEl.textContent = '已写 ' + ta.value.length + ' 字';
            }
            function setStatus(msg) {
                if (statusEl) statusEl.textContent = msg;
            }
            updateCount();

            function save(label) {
                setStatus('保存中…');
                fetch(SAVE_URL, {
                    method: 'POST',
                    credentials: 'same-origin',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ reflection: ta.value })
                }).then(function (r) { return r.json(); })
                  .then(function (d) {
                      if (d && d.ok) {
                          try { localStorage.removeItem(DRAFT_KEY); } catch (e) {}
                          setStatus(label || '已保存');
                      } else {
                          setStatus('保存失败，请重试');
                      }
                  })
                  .catch(function () { setStatus('网络异常，内容已存在本地'); });
            }

            var t = null;
            ta.addEventListener('input', function () {
                updateCount();
                try { localStorage.setItem(DRAFT_KEY, ta.value); } catch (e) {}
                setStatus('自动保存中…');
                clearTimeout(t);
                t = setTimeout(function () { save('已自动保存'); }, 1200);
            });

            form.addEventListener('submit', function (e) {
                e.preventDefault();
                clearTimeout(t);
                save('已保存 ✓');
            });

            window.addEventListener('beforeunload', function () {
                if (!ta.value) return;
                try {
                    navigator.sendBeacon(SAVE_URL,
                        new Blob([JSON.stringify({ reflection: ta.value })], { type: 'application/json' }));
                } catch (e) {}
            });
        })();
    </script>
    <script src="{{ url_for('static', filename='ui.js') }}" defer></script>
</body>
</html>
