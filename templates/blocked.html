<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>访问受限</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="app-body" style="--primary: {{ brand_color }}; --primary-dark: {{ brand_color }}" data-density="{{ ui_density }}">
    <main class="container narrow">
        <div class="empty-state" style="margin-top:24px">
            <div style="font-size:40px; margin-bottom:12px">
                <svg class="icon" style="width:48px;height:48px;color:var(--primary)" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
            </div>
            <h2>访问受限</h2>
            <p class="muted">您的 IP（{{ ip }}）已被管理员封禁，无法访问本系统。如有疑问，请联系老师。</p>
        </div>
    </main>
    <script src="{{ url_for('static', filename='ui.js') }}" defer></script>
</body>
</html>
